<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="200" viewBox="0 0 1600 200">
  <defs>
    <linearGradient id="lanyardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="30%" stop-color="#0f1f3d"/>
      <stop offset="70%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="goldStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0 L16 8 L8 16 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Fondo base con trama de tejido textil -->
  <rect width="1600" height="200" fill="url(#lanyardBg)"/>
  <rect width="1600" height="200" fill="url(#weave)"/>

  <!-- Costuras y líneas deportivas doradas y blancas -->
  <line x1="0" y1="16" x2="1600" y2="16" stroke="url(#goldStripe)" stroke-width="4" stroke-dasharray="14, 6"/>
  <line x1="0" y1="28" x2="1600" y2="28" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <line x1="0" y1="172" x2="1600" y2="172" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  <line x1="0" y1="184" x2="1600" y2="184" stroke="url(#goldStripe)" stroke-width="4" stroke-dasharray="14, 6"/>

  <!-- Tipografía y distintivos oficiales repetidos -->
  <g fill="#f8fafc" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="4">
    <!-- Bloque 1 -->
    <text x="50" y="112" fill="url(#goldStripe)">★</text>
    <text x="90" y="112" fill="#ffffff">LAGUNA ATHLETIC</text>
    <text x="530" y="112" fill="#38bdf8" font-size="28" font-weight="700">ACADEMY</text>
    <text x="730" y="112" fill="url(#goldStripe)" font-size="26">2026</text>
    <text x="820" y="112" fill="#94a3b8" font-size="22" font-weight="600" letter-spacing="3">FORJANDO CAMPEONES</text>

    <!-- Bloque 2 -->
    <text x="1270" y="112" fill="url(#goldStripe)">★</text>
    <text x="1310" y="112" fill="#ffffff">LAGUNA ATHLETIC</text>
  </g>
</svg>
